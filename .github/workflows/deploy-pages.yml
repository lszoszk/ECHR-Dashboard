name: Deploy ECHR Dashboard (GitHub Pages)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate pre-built stats
        run: |
          if [ ! -f "docs/data/stats.json" ]; then
            echo "::error::Pre-built stats.json not found. Run the enrichment pipeline locally first."
            exit 1
          fi
          python3 -c "
          import json, sys
          data = json.load(open('docs/data/stats.json'))
          cases = data.get('summary', {}).get('total_cases', 0)
          pr = len(data.get('citation_network', {}).get('pagerank_ranking', []))
          th = data.get('thesaurus_analytics', {}).get('cases_with_thesaurus', 0)
          print(f'stats.json: {cases} cases, {pr} PageRank entries, {th} thesaurus cases')
          if cases == 0:
              print('::error::stats.json has 0 cases — rebuild locally first')
              sys.exit(1)
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
