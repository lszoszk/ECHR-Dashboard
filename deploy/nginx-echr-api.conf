# Rate limiting zone -- 10 requests/second per IP, burst 20
limit_req_zone $binary_remote_addr zone=echr_api:10m rate=10r/s;

# Dynamic CORS origin — allow GitHub Pages + localhost dev servers
map $http_origin $cors_origin {
    default                     "";
    "https://lszoszk.github.io" "https://lszoszk.github.io";
    "http://localhost:4731"     "http://localhost:4731";
    "http://localhost:8080"     "http://localhost:8080";
    "http://127.0.0.1:4731"    "http://127.0.0.1:4731";
    "http://127.0.0.1:8080"    "http://127.0.0.1:8080";
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/echr-api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/echr-api.example.com/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    location /echr-api/api/ {
        limit_req zone=echr_api burst=20 nodelay;

        # CORS headers (Vary so caches key on Origin)
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age 600;
            add_header Content-Length 0;
            return 204;
        }

        # Proxy to Docker container
        proxy_pass http://127.0.0.1:8000/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /echr-api/health {
        limit_req zone=echr_api burst=20 nodelay;

        # CORS headers
        add_header Access-Control-Allow-Origin  $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            add_header Access-Control-Max-Age 600;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000/health;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
