<head>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F3XBX45HQC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F3XBX45HQC');

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    .meth-content { max-width: 920px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .meth-md { font-family: 'Inter', sans-serif; font-size: 0.96rem; line-height: 1.7; color: var(--text-secondary); }
    .meth-md h1, .meth-md h2, .meth-md h3, .meth-md h4 {
      font-family: 'Source Serif 4', Georgia, serif;
      color: var(--text-primary);
      margin-top: 2rem; margin-bottom: 1rem; line-height: 1.3;
    }
    .meth-md h1 { font-size: 1.85rem; border-bottom: 2px solid var(--border, #e2e8f0); padding-bottom: 0.5rem; margin-top: 0; }
    .meth-md h2 { font-size: 1.45rem; border-bottom: 1px solid var(--border, #e2e8f0); padding-bottom: 0.4rem; }
    .meth-md h3 { font-size: 1.18rem; }
    .meth-md h4 { font-size: 1.02rem; font-weight: 600; }
    .meth-md p { margin: 0.85rem 0; }
    .meth-md ul, .meth-md ol { padding-left: 1.6rem; margin: 0.85rem 0; }
    .meth-md li { margin-bottom: 0.35rem; }
    .meth-md code { background: var(--bg-card, #f1f5f9); padding: 0.12em 0.42em; border-radius: 4px; font-family: 'JetBrains Mono', Menlo, monospace; font-size: 0.86em; color: var(--text-primary); }
    .meth-md pre { background: var(--bg-card, #f8fafc); border: 1px solid var(--border, #e2e8f0); padding: 0.9rem 1.1rem; border-radius: 6px; overflow-x: auto; font-size: 0.84rem; line-height: 1.55; margin: 1rem 0; }
    .meth-md pre code { background: transparent; padding: 0; font-size: inherit; }
    .meth-md table { width: 100%; border-collapse: collapse; margin: 1.2rem 0; font-size: 0.9rem; }
    .meth-md th, .meth-md td { padding: 0.55rem 0.85rem; border: 1px solid var(--border, #e2e8f0); text-align: left; vertical-align: top; }
    .meth-md th { background: var(--bg-card, #f1f5f9); font-weight: 600; color: var(--text-primary); }
    .meth-md tr:nth-child(even) td { background: var(--bg-card, #f8fafc); }
    .meth-md a { color: var(--primary-accent, #2563eb); text-decoration: none; }
    .meth-md a:hover { text-decoration: underline; }
    .meth-md blockquote { border-left: 4px solid var(--primary-accent, #3b82f6); padding: 0.6rem 1rem; margin: 1rem 0; background: var(--bg-card, #f1f5f9); color: var(--text-secondary); font-style: italic; }
    .meth-md blockquote p { margin: 0; }
    .meth-md hr { border: none; border-top: 1px solid var(--border, #e2e8f0); margin: 2rem 0; }
    .meth-source-link { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 2rem; font-size: 0.86rem; color: var(--text-muted); }
    .meth-source-link a { color: var(--primary-accent, #2563eb); text-decoration: none; }
    [data-theme="dark"] .meth-md code, [data-theme="dark"] .meth-md pre, [data-theme="dark"] .meth-md blockquote { background: #1e293b; color: #e2e8f0; }
    [data-theme="dark"] .meth-md th { background: #1e293b; }
    [data-theme="dark"] .meth-md tr:nth-child(even) td { background: #182234; }
    .meth-loading { text-align: center; padding: 3rem 0; color: var(--text-muted); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="./" class="nav-brand">
        <span class="brand-icon">§</span>
        <span class="brand-text">HUDOC Researcher</span>
      </a>
      <button class="nav-hamburger" id="navHamburger" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="./" class="nav-link">Search</a>
        <a href="semantic.html" class="nav-link">Semantic Search</a>
        <a href="analytics.html" class="nav-link">Statistics</a>
        <a href="methodology.html" class="nav-link active">Methodology</a>
        <a href="about.html" class="nav-link">About</a>
      </div>
      <button class="a11y-btn" id="accessibilityBtn" type="button" title="Accessibility settings (Alt+A)" aria-label="Accessibility settings">
        <span class="a11y-icon">Aa</span>
      </button>
      <button class="theme-toggle" id="themeToggle" type="button" title="Toggle light/dark theme" aria-label="Toggle dark mode">
        <span class="theme-icon-light">☀️</span>
        <span class="theme-icon-dark">🌙</span>
      </button>
    </div>
  </nav>

  <main class="meth-content">
    <div class="meth-md" id="meth-md">
      <p class="meth-loading">Loading methodology…</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script>
    (function() {
      const html = document.documentElement;
      const stored = localStorage.getItem('theme');
      if (stored) html.setAttribute('data-theme', stored);
      document.getElementById('themeToggle')?.addEventListener('click', () => {
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
      document.getElementById('navHamburger')?.addEventListener('click', () => {
        document.querySelector('.nav-links')?.classList.toggle('open');
      });
    })();

    fetch('methodology/README.md', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(md => {
        marked.setOptions({ gfm: true, breaks: false, headerIds: true, mangle: false });
        document.getElementById('meth-md').innerHTML = marked.parse(md);
      })
      .catch(e => {
        document.getElementById('meth-md').innerHTML = '<p style="color:#b91c1c;">Could not load: ' + e.message + '</p>';
      });
  </script>
</body>
</html>
